<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/><title>Frog Tongue Catch</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Cellipse cx='100' cy='120' rx='65' ry='50' fill='%237ED957'/%3E%3Ccircle cx='70' cy='60' r='30' fill='%237ED957'/%3E%3Ccircle cx='130' cy='60' r='30' fill='%237ED957'/%3E%3Ccircle cx='70' cy='60' r='20' fill='white'/%3E%3Ccircle cx='130' cy='60' r='20' fill='white'/%3E%3Ccircle cx='70' cy='65' r='9' fill='black'/%3E%3Ccircle cx='130' cy='65' r='9' fill='black'/%3E%3Ccircle cx='65' cy='58' r='4' fill='white'/%3E%3Ccircle cx='125' cy='58' r='4' fill='white'/%3E%3Cpath d='M75 135 Q100 155 125 135' stroke='black' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E"><script async src="https://www.googletagmanager.com/gtag/js?id=G-FTQ4W87FCQ"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-FTQ4W87FCQ');</script><link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#93BFC7;--card:#ECF4E8;--card-bd:#ABE7B2;--txt:#1e3d2f;--green:#27ae60;--red:#ef4444;}*{box-sizing:border-box;margin:0;padding:0;}html,body{height:100%;font-family:'Quicksand',system-ui,sans-serif;background:var(--bg);overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent;}header{height:58px;padding:0 16px;background:linear-gradient(135deg,#CBF3BB 0%,#ABE7B2 55%,#93BFC7 100%);display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 3px 16px rgba(0,0,0,.18);position:relative;z-index:10;}.title{font-size:20px;font-weight:800;color:var(--txt);display:flex;align-items:center;gap:7px;flex-shrink:0;}.caught-display{font-size:17px;font-weight:800;color:var(--txt);display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.35);border:1.5px solid rgba(255,255,255,.5);border-radius:14px;padding:4px 12px;}.caught-display .count{color:var(--green);font-size:20px;}.hearts{display:flex;gap:2px;font-size:20px;line-height:1;}.heart{transition:all .3s;display:inline-block;}.heart.gone{filter:grayscale(1) opacity(.2);transform:scale(.75);}#diffSel{appearance:none;-webkit-appearance:none;background:rgba(255,255,255,.35);border:1.5px solid rgba(255,255,255,.5);border-radius:14px;padding:4px 10px;font-size:12px;font-weight:800;color:var(--txt);font-family:'Quicksand',sans-serif;cursor:pointer;outline:none;transition:background .15s;}#diffSel:hover{background:rgba(255,255,255,.55);}#diffSel option{background:#ECF4E8;color:var(--txt);font-weight:700;}#muteBtn{background:rgba(255,255,255,.35);border:1.5px solid rgba(255,255,255,.5);border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0;}#muteBtn:hover{background:rgba(255,255,255,.55);}#pond{position:relative;width:100%;height:calc(100vh - 58px);background:radial-gradient(ellipse 90% 70% at 55% 55%,#4bbdd8 0%,#2e95b2 45%,#1d6e88 100%);overflow:hidden;}#pond::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(-42deg,transparent 0,transparent 22px,rgba(255,255,255,.035) 22px,rgba(255,255,255,.035) 23px);pointer-events:none;}.deco{position:absolute;pointer-events:none;opacity:.75;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25));z-index:3;}.fish{z-index:2;opacity:.55;filter:drop-shadow(0 1px 3px rgba(0,0,0,.2));animation:fishSwim 7s ease-in-out infinite;}.fish:nth-child(2n){animation-duration:9s;animation-direction:alternate-reverse;}@keyframes fishSwim{0%,100%{transform:translateX(0) scaleX(1);}45%{transform:translateX(18px) scaleX(1);}50%{transform:translateX(18px) scaleX(-1);}95%{transform:translateX(0) scaleX(-1);}}.dragonfly{position:absolute;pointer-events:none;z-index:6;animation:dfFloat 3.4s ease-in-out infinite;}.dragonfly svg{display:block;}.df-wing{animation:dfWing .12s linear infinite alternate;transform-origin:center;}@keyframes dfFloat{0%,100%{transform:translateY(0) rotate(0deg);}30%{transform:translateY(-10px) rotate(4deg);}70%{transform:translateY(5px) rotate(-3deg);}}@keyframes dfWing{from{opacity:.55;}to{opacity:.85;}}.pad{position:absolute;z-index:4;pointer-events:none;}#baby{position:absolute;transform:translate(-50%,-50%);z-index:20;pointer-events:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45));}#baby.hop{animation:frogHop .5s ease-in-out;}@keyframes frogHop{0%{transform:translate(-50%,-50%) scale(1) rotate(0);}25%{transform:translate(-50%,calc(-50% - 38px)) scale(.88) rotate(-6deg);}55%{transform:translate(-50%,calc(-50% - 55px)) scale(.9) rotate(6deg);}80%{transform:translate(-50%,calc(-50% - 12px)) scale(1.06);}100%{transform:translate(-50%,-50%) scale(1) rotate(0);}}#baby.splash{animation:frogSplash .9s ease-in-out;}@keyframes frogSplash{0%{transform:translate(-50%,-50%) scale(1);opacity:1;}18%{transform:translate(-50%,calc(-50% + 6px)) scale(1.1);}38%{transform:translate(-50%,calc(-50% + 22px)) scale(.45);opacity:.45;filter:blur(1.5px) drop-shadow(0 2px 4px rgba(0,0,0,.3));}58%{transform:translate(-50%,calc(-50% + 28px)) scale(.3);opacity:.2;}78%{transform:translate(-50%,calc(-50% + 8px)) scale(.85);opacity:.75;filter:drop-shadow(0 4px 7px rgba(0,0,0,.4));}100%{transform:translate(-50%,-50%) scale(1);opacity:1;}}#tongue{position:absolute;height:11px;border-radius:6px;background:linear-gradient(90deg,#d63881,#ff79bb);transform-origin:0 50%;pointer-events:none;z-index:15;transform:scaleX(0);box-shadow:0 2px 8px rgba(214,56,129,.55);}#tongue::after{content:'';position:absolute;right:-7px;top:50%;transform:translateY(-50%);width:16px;height:16px;border-radius:50%;background:#d63881;box-shadow:0 2px 6px rgba(214,56,129,.6);}.ripple{position:absolute;border-radius:50%;border:3px solid rgba(140,220,255,.75);transform:translate(-50%,-50%) scale(0);pointer-events:none;z-index:18;}.ripple.go{animation:rippleOut .9s ease-out forwards;}@keyframes rippleOut{0%{transform:translate(-50%,-50%) scale(0);opacity:1;}100%{transform:translate(-50%,-50%) scale(3.5);opacity:0;}}.bug{position:absolute;pointer-events:none;z-index:10;animation:bugFloat var(--dur,10s) linear forwards;}.bug-inner{display:flex;flex-direction:column;align-items:center;gap:3px;animation:bugBob 1.8s ease-in-out infinite;}@keyframes bugFloat{from{left:110%;}to{left:-14%;}}@keyframes bugBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-11px);}}.bug-letter{background:rgba(255,255,255,.96);color:var(--txt);font-size:28px;font-weight:800;width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 12px rgba(0,0,0,.35);border:2.5px solid rgba(39,174,96,.45);line-height:1;}.bug-emoji{font-size:38px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3));animation:bugWiggle .55s ease-in-out infinite alternate;}@keyframes bugWiggle{from{transform:rotate(-9deg);}to{transform:rotate(9deg);}}.bug.popping .bug-inner{animation:bugPop .28s ease-out forwards;}@keyframes bugPop{0%{transform:scale(1);opacity:1;}60%{transform:scale(1.5);opacity:.8;}100%{transform:scale(0);opacity:0;}}.pop-anim{animation:countPop .35s ease-out;}@keyframes countPop{0%{transform:scale(1);}45%{transform:scale(1.5);color:var(--green);}100%{transform:scale(1);}}#key-hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.22);backdrop-filter:blur(8px);border:1.5px solid rgba(255,255,255,.38);border-radius:16px;padding:7px 20px;font-size:14px;font-weight:700;color:rgba(255,255,255,.9);z-index:30;text-align:center;pointer-events:none;white-space:nowrap;}#overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px);}#overlay.hide{display:none;}.obox{background:var(--card);border-radius:28px;padding:38px 48px;text-align:center;max-width:420px;width:90%;box-shadow:0 24px 70px rgba(0,0,0,.5);animation:boxPop .4s cubic-bezier(.34,1.56,.64,1);}@keyframes boxPop{0%{transform:scale(.65);opacity:0;}100%{transform:scale(1);opacity:1;}}.oem{font-size:64px;margin-bottom:10px;line-height:1;}.otitle{font-size:30px;font-weight:800;color:var(--txt);margin-bottom:10px;}.omsg{font-size:15px;color:#555;line-height:1.7;margin-bottom:28px;}.obtn{padding:13px 44px;border-radius:30px;border:none;background:linear-gradient(135deg,#2ecc71,#27ae60);color:#fff;font-size:18px;font-weight:800;cursor:pointer;font-family:'Quicksand',sans-serif;box-shadow:0 5px 18px rgba(39,174,96,.45);transition:transform .12s,box-shadow .12s;}.obtn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(39,174,96,.55);}.obtn:active{transform:scale(.96);}</style></head><body>
<header><div class="title"><svg width="30" height="30" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0"><ellipse cx="100" cy="120" rx="65" ry="50" fill="#7ED957"/><circle cx="70" cy="60" r="30" fill="#7ED957"/><circle cx="130" cy="60" r="30" fill="#7ED957"/><circle cx="70" cy="60" r="20" fill="white"/><circle cx="130" cy="60" r="20" fill="white"/><circle cx="70" cy="65" r="9" fill="black"/><circle cx="130" cy="65" r="9" fill="black"/><circle cx="65" cy="58" r="4" fill="white"/><circle cx="125" cy="58" r="4" fill="white"/><path d="M75 135 Q100 155 125 135" stroke="black" stroke-width="3" fill="none" stroke-linecap="round"/></svg>Frog Catch!</div><div class="caught-display">🐛 <span class="count" id="caughtEl">0</span><span style="opacity:.55;font-size:15px">/ 15</span></div><div class="hearts" id="hearts"></div><select id="diffSel" title="Difficulty"><option value="easy">🟢 Easy</option><option value="medium">🟡 Medium</option><option value="hard">🔴 Hard</option></select><button id="muteBtn" title="Mute / Unmute">🔊</button></header>
<div id="pond"><div id="tongue"></div><div id="baby"><svg width="96" height="96" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><ellipse cx="100" cy="120" rx="65" ry="50" fill="#7ED957"/><circle cx="70" cy="60" r="30" fill="#7ED957"/><circle cx="130" cy="60" r="30" fill="#7ED957"/><circle cx="70" cy="60" r="20" fill="white"/><circle cx="130" cy="60" r="20" fill="white"/><circle cx="70" cy="65" r="9" fill="black"/><circle cx="130" cy="65" r="9" fill="black"/><circle cx="65" cy="58" r="4" fill="white"/><circle cx="125" cy="58" r="4" fill="white"/><circle cx="55" cy="125" r="10" fill="#FFB6C1"/><circle cx="145" cy="125" r="10" fill="#FFB6C1"/><path d="M75 135 Q100 155 125 135" stroke="black" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M95 35 Q100 20 105 35" stroke="#4CAF50" stroke-width="4" fill="none" stroke-linecap="round"/></svg></div><div id="key-hint">Press the letter key to catch the bug! 🐸</div></div>
<div id="overlay"><div class="obox"><div class="oem" id="oem">🐸</div><div class="otitle" id="otitle">Frog Tongue Catch!</div><div class="omsg" id="omsg">Bugs are flying across the pond!<br><br>Press the <strong>letter key</strong> shown on each bug<br>to catch it with the frog's tongue! 🐛<br><br><strong>Catch 15 bugs to win.<br>Let 5 escape and it's game over!</strong></div><button class="obtn" id="obtn">Start!</button></div></div>
<script>
let _actx=null,muted=false;
function actx(){if(!_actx)_actx=new(window.AudioContext||window.webkitAudioContext)();if(_actx.state==='suspended')_actx.resume();return _actx;}
function osc(freq,type,t,dur,vol,freqTo){if(muted)return;const c=actx(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type=type;o.frequency.setValueAtTime(freq,t);if(freqTo)o.frequency.exponentialRampToValueAtTime(freqTo,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.start(t);o.stop(t+dur+0.01);}
function noiseBlast(t,dur,vol,bandHz){if(muted)return;const c=actx(),len=Math.ceil(c.sampleRate*dur),buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;const src=c.createBufferSource();src.buffer=buf;const flt=c.createBiquadFilter();flt.type='bandpass';flt.frequency.value=bandHz;flt.Q.value=0.8;const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);src.connect(flt);flt.connect(g);g.connect(c.destination);src.start(t);src.stop(t+dur+0.01);}
function sndCatch(){const t=actx().currentTime;osc(900,'sine',t,0.05,0.3,500);osc(523,'sine',t+0.07,0.13,0.28);osc(659,'sine',t+0.18,0.13,0.25);osc(784,'sine',t+0.29,0.14,0.22);}
function sndMiss(){const t=actx().currentTime;osc(350,'sine',t,0.18,0.22,120);noiseBlast(t,0.35,0.45,700);noiseBlast(t+0.08,0.22,0.2,1200);}
function sndWin(){const t=actx().currentTime;[523,587,659,784,1047].forEach((f,i)=>osc(f,'sine',t+i*0.13,0.18,0.3));}
function sndGameOver(){const t=actx().currentTime;osc(392,'sawtooth',t,0.32,0.18,196);osc(330,'sawtooth',t+0.38,0.32,0.18,165);osc(262,'sawtooth',t+0.76,0.5,0.18,131);}
const DIFF={easy:{letters:['A','E','I','O','U'],maxBugs:1,durMs:12500,spawnMs:3800},medium:{letters:['A','S','D','F','G','H','J','K','L'],maxBugs:2,durMs:9200,spawnMs:2800},hard:{letters:'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''),maxBugs:3,durMs:7000,spawnMs:2100}};
const BUG_EMOJIS=['🐛','🦋','🪲','🐝','🦗','🦟','🐞'];
const WIN_TARGET=15,MAX_HP=5,FROG_L=14,FROG_T=64;
let caught=0,hp=MAX_HP,activeBugs=[],bugIdCtr=0,tongueActive=false,gameRunning=false,spawnTimer=null;
const pond=document.getElementById('pond'),baby=document.getElementById('baby'),tongue=document.getElementById('tongue'),overlay=document.getElementById('overlay'),heartsEl=document.getElementById('hearts'),caughtEl=document.getElementById('caughtEl');
function getDiff(){return DIFF[document.getElementById('diffSel').value];}
function placeFrog(){baby.style.left=FROG_L+'%';baby.style.top=FROG_T+'%';}
function renderHearts(){heartsEl.innerHTML='';for(let i=0;i<MAX_HP;i++){const s=document.createElement('span');s.className='heart'+(i>=hp?' gone':'');s.textContent='❤️';heartsEl.appendChild(s);}}
function buildDecos(){pond.querySelectorAll('.deco,.dragonfly,.pad,.ripple').forEach(e=>e.remove());const rnd=(lo,hi)=>lo+Math.random()*(hi-lo),rndI=(lo,hi)=>Math.floor(rnd(lo,hi+1)),spots=[[FROG_L,FROG_T]];function pick(gap){for(let t=0;t<40;t++){const l=rnd(6,90),tp=rnd(10,80);if(spots.every(([sl,st])=>Math.hypot(l-sl,tp-st)>gap)){spots.push([l,tp]);return[l,tp];}}const l=rnd(6,90),tp=rnd(10,80);spots.push([l,tp]);return[l,tp];}const pad=document.createElement('div');pad.className='pad';pad.style.cssText=`left:${FROG_L}%;top:${FROG_T}%;transform:translate(-50%,-50%) rotate(18deg);z-index:4;`;pad.innerHTML=`<svg width="104" height="104" viewBox="0 0 100 100"><path d="M50 10 C75 10,90 40,75 70 C60 90,30 90,15 70 C0 40,25 10,50 10 Z" fill="rgba(0,0,0,.18)" transform="translate(4,6)"/><path d="M50 10 C75 10,90 40,75 70 C60 90,30 90,15 70 C0 40,25 10,50 10 Z" fill="#7ED957"/><path d="M50 10 C75 10,90 40,75 70 C60 90,30 90,15 70 C0 40,25 10,50 10 Z" fill="none" stroke="#5BBF3A" stroke-width="1.8" opacity=".5"/><path d="M50 10 L55 50 L50 90" stroke="#5BBF3A" stroke-width="2" fill="none" opacity=".75"/><path d="M55 50 L70 35 M55 50 L72 58 M55 50 L38 32 M55 50 L34 60" stroke="#5BBF3A" stroke-width="1.2" fill="none" opacity=".5"/><ellipse cx="38" cy="30" rx="12" ry="7" fill="rgba(255,255,255,.14)" transform="rotate(-20 38 30)"/></svg>`;pond.insertBefore(pad,baby);for(let i=0;i<4;i++){const[l,t]=pick(15),el=document.createElement('span');el.className='deco';el.style.cssText=`font-size:${rndI(42,64)}px;left:${l}%;top:${t}%;transform:rotate(${rndI(-30,30)}deg);`;el.textContent='🪷';pond.insertBefore(el,pad);}['🐠','🐟','🐡'].forEach(emoji=>{const[l,t]=pick(12),el=document.createElement('span');el.className='deco fish';el.style.cssText=`font-size:${rndI(44,58)}px;left:${l}%;top:${t}%;animation-delay:${rndI(-5,0)}s;`;el.textContent=emoji;pond.insertBefore(el,pad);});[[72,58,'rgba(190,235,255,.65)','rgba(100,190,230,.55)','rgba(190,235,255,.45)','rgba(100,190,230,.4)','#00bcd4','#00acc1','#0097a7','#003d4a'],[64,52,'rgba(200,255,210,.65)','rgba(80,200,120,.55)','rgba(200,255,210,.45)','rgba(80,200,120,.4)','#43a047','#388e3c','#2e7d32','#1a3a1c']].forEach(([w,h,wf,ws,wf2,ws2,b,b2,hd,ey])=>{const[l,t]=pick(18),el=document.createElement('div');el.className='dragonfly';el.style.cssText=`left:${l}%;top:${t}%;animation-delay:${rnd(-3,0).toFixed(1)}s;animation-duration:${rnd(3,4.5).toFixed(1)}s;`;el.innerHTML=`<svg width="${w}" height="${h}" viewBox="0 0 40 32"><ellipse cx="15" cy="10" rx="13" ry="7" fill="${wf}" stroke="${ws}" stroke-width="1.2" class="df-wing"/><ellipse cx="25" cy="10" rx="13" ry="7" fill="${wf}" stroke="${ws}" stroke-width="1.2" class="df-wing"/><ellipse cx="15" cy="19" rx="10" ry="5.5" fill="${wf2}" stroke="${ws2}" stroke-width="1" class="df-wing"/><ellipse cx="25" cy="19" rx="10" ry="5.5" fill="${wf2}" stroke="${ws2}" stroke-width="1" class="df-wing"/><ellipse cx="20" cy="18" rx="2.5" ry="11" fill="${b}"/><ellipse cx="20" cy="8" rx="2.5" ry="5" fill="${b2}"/><circle cx="20" cy="3" r="3.5" fill="${hd}"/><circle cx="18.2" cy="2.2" r="1.1" fill="${ey}"/><circle cx="21.8" cy="2.2" r="1.1" fill="${ey}"/></svg>`;pond.insertBefore(el,pad);});}
function spawnBug(){if(!gameRunning)return;const cfg=getDiff();if(activeBugs.length>=cfg.maxBugs)return;const id=bugIdCtr++,letter=cfg.letters[Math.floor(Math.random()*cfg.letters.length)],emoji=BUG_EMOJIS[Math.floor(Math.random()*BUG_EMOJIS.length)],pondH=pond.clientHeight,topPx=pondH*0.15+Math.random()*pondH*0.60,durMs=cfg.durMs+(Math.random()-0.5)*1600,el=document.createElement('div');el.className='bug';el.style.cssText=`top:${topPx.toFixed(1)}px;left:110%;--dur:${durMs.toFixed(0)}ms;`;el.innerHTML=`<div class="bug-inner"><div class="bug-letter">${letter}</div><div class="bug-emoji">${emoji}</div></div>`;pond.appendChild(el);const bug={id,letter,el,gone:false};activeBugs.push(bug);el.addEventListener('animationend',e=>{if(e.animationName==='bugFloat'&&!bug.gone&&gameRunning)escapeBug(bug);});}
function removeBugEl(bug){activeBugs=activeBugs.filter(b=>b.id!==bug.id);setTimeout(()=>{if(bug.el.parentNode)bug.el.parentNode.removeChild(bug.el);},350);}
function catchBug(bug){if(tongueActive||bug.gone)return;tongueActive=true;bug.gone=true;const pr=pond.getBoundingClientRect(),fr=baby.getBoundingClientRect(),br=bug.el.getBoundingClientRect(),frogX=fr.left-pr.left+fr.width/2,frogY=fr.top-pr.top+fr.height/2,bugX=br.left-pr.left+br.width/2,bugY=br.top-pr.top+br.height/2,dx=bugX-frogX,dy=bugY-frogY,dist=Math.sqrt(dx*dx+dy*dy),ang=Math.atan2(dy,dx)*180/Math.PI;tongue.style.cssText=`left:${frogX}px;top:${frogY-5.5}px;width:${dist}px;transform:rotate(${ang}deg) scaleX(0);transition:none;`;tongue.offsetWidth;tongue.style.transition='transform 0.13s ease-out';tongue.style.transform=`rotate(${ang}deg) scaleX(1)`;bug.el.classList.add('popping');sndCatch();baby.classList.remove('hop');void baby.offsetWidth;baby.classList.add('hop');setTimeout(()=>{removeBugEl(bug);tongue.style.transition='transform 0.1s ease-in';tongue.style.transform=`rotate(${ang}deg) scaleX(0)`;caught++;caughtEl.textContent=caught;caughtEl.classList.remove('pop-anim');void caughtEl.offsetWidth;caughtEl.classList.add('pop-anim');setTimeout(()=>{baby.classList.remove('hop');tongueActive=false;if(caught>=WIN_TARGET&&gameRunning)endGame(true);},160);},145);}
function escapeBug(bug){if(bug.gone)return;bug.gone=true;activeBugs=activeBugs.filter(b=>b.id!==bug.id);if(bug.el.parentNode)bug.el.parentNode.removeChild(bug.el);hp--;renderHearts();sndMiss();baby.classList.remove('splash');void baby.offsetWidth;baby.classList.add('splash');spawnRipple();setTimeout(()=>{baby.classList.remove('splash');if(hp<=0&&gameRunning)endGame(false);},950);}
function spawnRipple(){[80,48].forEach((sz,i)=>{const r=document.createElement('div');r.className='ripple';r.style.cssText=`left:${FROG_L}%;top:${FROG_T}%;width:${sz}px;height:${sz}px;animation-delay:${i*140}ms;`;pond.appendChild(r);r.offsetWidth;r.classList.add('go');setTimeout(()=>r.remove(),1000);});}
function startGame(){caught=0;hp=MAX_HP;tongueActive=false;gameRunning=true;overlay.classList.add('hide');clearInterval(spawnTimer);pond.querySelectorAll('.bug').forEach(e=>e.remove());activeBugs=[];buildDecos();placeFrog();renderHearts();caughtEl.textContent='0';tongue.style.cssText='transform:scaleX(0);transition:none;';const cfg=getDiff();spawnBug();spawnTimer=setInterval(()=>{if(gameRunning)spawnBug();},cfg.spawnMs);}
function endGame(won){gameRunning=false;clearInterval(spawnTimer);tongueActive=false;tongue.style.cssText='transform:scaleX(0);transition:none;';activeBugs.forEach(b=>{if(b.el.parentNode)b.el.parentNode.removeChild(b.el);});activeBugs=[];if(won){sndWin();setTimeout(()=>showOverlay('🏆','Amazing!',`You caught all <strong>${WIN_TARGET} bugs</strong>!<br><br>The frog is full and happy! 🐸💚<br><br>Fantastic typing! 🌟`,'Play Again!'),700);}else{sndGameOver();setTimeout(()=>showOverlay('😢','Oh no!','Too many bugs escaped the pond...<br><br>The frog is still hungry! 🐸<br><br>Don\'t give up — try again! 💪','Try Again! 💪'),1100);}}
function showOverlay(em,title,msg,btnTxt){document.getElementById('oem').textContent=em;document.getElementById('otitle').textContent=title;document.getElementById('omsg').innerHTML=msg;document.getElementById('obtn').textContent=btnTxt;overlay.classList.remove('hide');}
document.addEventListener('keydown',e=>{if(!gameRunning||tongueActive)return;const key=e.key.toUpperCase();if(key.length!==1||!/[A-Z]/.test(key))return;const matches=activeBugs.filter(b=>b.letter===key&&!b.gone);if(!matches.length)return;const pr=pond.getBoundingClientRect(),target=matches.reduce((best,b)=>{const bx=b.el.getBoundingClientRect().left-pr.left,bestX=best?best.el.getBoundingClientRect().left-pr.left:Infinity;return bx<bestX?b:best;},null);if(target)catchBug(target);});
document.getElementById('obtn').addEventListener('click',startGame);
document.getElementById('diffSel').addEventListener('change',()=>{if(gameRunning)startGame();});
document.getElementById('muteBtn').addEventListener('click',()=>{muted=!muted;document.getElementById('muteBtn').textContent=muted?'🔇':'🔊';});
</script></body></html>
